spring:
  application:
    name: inkflow-crm

  datasource:
    url: jdbc:postgresql://aws-1-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: ${DB_USERNAME:postgres.orxguferhezbfbgmlrzc}
    password: ${DB_PASSWORD:_t4ORd5vLZLhm4jo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

# Cloudflare R2 Storage
r2:
  account-id: ${R2_ACCOUNT_ID:8e987ad59f6f797133fb456f9634c382}
  access-key-id: ${R2_ACCESS_KEY_ID:d55be8f09aeefed881c8d28dbaf1c2a8}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:3d97fe6b37db6a9ba27900cf5f0fc9059e12765e85c7b3b33e592732b7314d1c}
  bucket-name: ${R2_BUCKET_NAME:inkat-crm}
  public-url: ${R2_PUBLIC_URL:https://pub-c3324f961f15454f98b95bbf7115ca14.r2.dev}

# Supabase JWT Configuration
supabase:
  jwt:
    issuer: https://orxguferhezbfbgmlrzc.supabase.co/auth/v1
    jwks-uri: https://orxguferhezbfbgmlrzc.supabase.co/auth/v1/.well-known/jwks.json

# Logging
logging:
  level:
    root: INFO
    com.inkflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: WARN
    com.inkflow: INFO

monobank:
  acquiring:
    token: ${MONOBANK_TOKEN:REPLACE_WITH_REAL_TOKEN}
    api-url: https://api.monobank.ua
    webhook-url: ${APP_BASE_URL:http://localhost:8080}/api/payments/monobank/webhook
    redirect-url: ${FRONTEND_URL:http://localhost:5173}/app/calendar
    invoice-validity-seconds: 3600
