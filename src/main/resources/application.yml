spring:
  application:
    name: inkflow-crm

  mvc:
    async:
      request-timeout: 120000

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/postgres?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
    open-in-view: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

inkflow:
  app-name: ${INKFLOW_APP_NAME:CRM}
  default-timezone: ${INKFLOW_DEFAULT_TIMEZONE:Europe/Kyiv}
  default-language: ${INKFLOW_DEFAULT_LANGUAGE:uk}
  default-start-page: ${INKFLOW_DEFAULT_START_PAGE:/calendar}
  openapi:
    enabled: ${OPENAPI_ENABLED:false}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
      - ${CONSUMER_FRONTEND_URL:http://localhost:5174}
    allow-credentials: true

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}
  verify-connection: ${R2_VERIFY_CONNECTION:true}

demo:
  tenant-id: ${DEMO_TENANT_ID:}

resend:
  api-key: ${RESEND_API_KEY}
  api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  from-email: ${RESEND_FROM_EMAIL}
  from-name: ${RESEND_FROM_NAME:${inkflow.app-name:CRM}}

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    jwks-uri: ${SUPABASE_JWKS_URI}

google:
  calendar:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/public/google/callback}
    frontend-redirect: ${FRONTEND_URL:http://localhost:5173}/app/settings

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    image-model: gemini-2.5-flash-image
    temperature: 0.3
    image-temperature: 0.8
    try-on-temperature: 0.4
    api-base: https://generativelanguage.googleapis.com/v1beta/models
    max-image-side: 1024

huggingface:
  api:
    key: ${HUGGINGFACE_API_KEY:}
    model-url: https://router.huggingface.co/hf-inference/models/intfloat/multilingual-e5-large-instruct

unsplash:
  api:
    key: ${UNSPLASH_API_KEY:}
    base-url: https://api.unsplash.com
  seed:
    query: tattoo
    pages: 2
    per-page: 50

fcm:
  server-key: ${FCM_SERVER_KEY:}

monobank:
  acquiring:
    token: ${MONOBANK_TOKEN:}
    api-url: https://api.monobank.ua
    webhook-url: ${APP_BASE_URL:http://localhost:8080}/api/payments/monobank/webhook
    redirect-url: ${FRONTEND_URL:http://localhost:5173}/app/calendar
    invoice-validity-seconds: 3600

logging:
  level:
    root: INFO
    com.inkflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

springdoc:
  api-docs:
    enabled: ${inkflow.openapi.enabled:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${inkflow.openapi.enabled:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
  show-actuator: false
  packages-to-scan: com.inkflow.crm.module

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

inkflow:
  openapi:
    enabled: true

logging:
  level:
    com.inkflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: WARN
    com.inkflow: INFO

---
spring:
  config:
    activate:
      on-profile: staging

inkflow:
  openapi:
    enabled: true
