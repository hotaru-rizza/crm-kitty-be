spring:
  application:
    name: inkflow-crm

  mvc:
    async:
      request-timeout: 120000

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/postgres?sslmode=disable&connectTimeout=5&socketTimeout=10}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 5000
      initialization-fail-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 9
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

inkflow:
  app-name: ${INKFLOW_APP_NAME:CRM}
  default-timezone: ${INKFLOW_DEFAULT_TIMEZONE:Europe/Kyiv}
  default-language: ${INKFLOW_DEFAULT_LANGUAGE:uk}
  default-start-page: ${INKFLOW_DEFAULT_START_PAGE:/calendar}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  invite:
    ttl-days: ${INKFLOW_INVITE_TTL_DAYS:7}
    cleanup-enabled: ${INKFLOW_INVITE_CLEANUP_ENABLED:true}
    cleanup-retention-days-after-expiry: ${INKFLOW_INVITE_CLEANUP_RETENTION_DAYS:30}
    cleanup-cron: ${INKFLOW_INVITE_CLEANUP_CRON:0 0 4 * * *}
  openapi:
    enabled: ${OPENAPI_ENABLED:false}
  email:
    scheduler:
      fixed-rate-ms: ${INKFLOW_EMAIL_SCHEDULER_FIXED_RATE_MS:900000}
      catch-up-max-hours: ${INKFLOW_EMAIL_SCHEDULER_CATCH_UP_MAX_HOURS:48}
    outbox:
      fixed-rate-ms: ${INKFLOW_EMAIL_OUTBOX_FIXED_RATE_MS:30000}
      batch-size: ${INKFLOW_EMAIL_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${INKFLOW_EMAIL_OUTBOX_MAX_ATTEMPTS:5}
      base-backoff-ms: ${INKFLOW_EMAIL_OUTBOX_BASE_BACKOFF_MS:60000}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
      - ${CONSUMER_FRONTEND_URL:http://localhost:5174}
    allow-credentials: true
  audit:
    retention-enabled: ${INKFLOW_AUDIT_RETENTION_ENABLED:true}
    retention-days: ${INKFLOW_AUDIT_RETENTION_DAYS:730}
    retention-cron: ${INKFLOW_AUDIT_RETENTION_CRON:0 0 3 * * *}
  appointments:
    default-reservation-duration-minutes: ${INKFLOW_DEFAULT_RESERVATION_DURATION_MINUTES:60}
  rate-limit:
    enabled: ${INKFLOW_RATE_LIMIT_ENABLED:true}

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}
  verify-connection: ${R2_VERIFY_CONNECTION:true}
  signed-download-ttl-minutes: ${R2_SIGNED_DOWNLOAD_TTL_MINUTES:60}

demo:
  tenant-id: ${DEMO_TENANT_ID:}

resend:
  api-key: ${RESEND_API_KEY}
  api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  from-email: ${RESEND_FROM_EMAIL}
  from-name: ${RESEND_FROM_NAME:${inkflow.app-name:CRM}}

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    jwks-uri: ${SUPABASE_JWKS_URI}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}

google:
  calendar:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/public/google/callback}
    frontend-redirect: ${FRONTEND_URL:http://localhost:5173}/app/profile

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    image-model: gemini-2.5-flash-image
    temperature: 0.3
    image-temperature: 0.8
    try-on-temperature: 0.4
    api-base: https://generativelanguage.googleapis.com/v1beta/models
    max-image-side: 1024

huggingface:
  api:
    key: ${HUGGINGFACE_API_KEY:}
    model-url: https://router.huggingface.co/hf-inference/models/intfloat/multilingual-e5-large-instruct

unsplash:
  api:
    key: ${UNSPLASH_API_KEY:}
    base-url: https://api.unsplash.com
  seed:
    query: tattoo
    pages: 2
    per-page: 50

fcm:
  server-key: ${FCM_SERVER_KEY:}

monobank:
  acquiring:
    token: ${MONOBANK_TOKEN:}
    api-url: https://api.monobank.ua
    webhook-url: ${APP_BASE_URL:http://localhost:8080}/api/payments/monobank/webhook
    redirect-url: ${FRONTEND_URL:http://localhost:5173}/app/calendar
    invoice-validity-seconds: 3600

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.inkflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

springdoc:
  api-docs:
    enabled: ${inkflow.openapi.enabled:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${inkflow.openapi.enabled:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
  show-actuator: false
  packages-to-scan: com.inkflow.crm.module

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false
