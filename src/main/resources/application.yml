spring:
  application:
    name: inkflow-crm

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/postgres?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

# Cloudflare R2 — значення тільки з env / .env
r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}
  verify-connection: ${R2_VERIFY_CONNECTION:true}

demo:
  tenant-id: ${DEMO_TENANT_ID:a0000000-0000-0000-0000-000000000001}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-name: ${RESEND_FROM_NAME:INKAT}

supabase:
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER}
    jwks-uri: ${SUPABASE_JWKS_URI}

logging:
  level:
    root: INFO
    com.inkflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

logging:
  level:
    com.inkflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: WARN
    com.inkflow: INFO

monobank:
  acquiring:
    token: ${MONOBANK_TOKEN:}
    api-url: https://api.monobank.ua
    webhook-url: ${APP_BASE_URL:http://localhost:8080}/api/payments/monobank/webhook
    redirect-url: ${FRONTEND_URL:http://localhost:5173}/app/calendar
    invoice-validity-seconds: 3600
