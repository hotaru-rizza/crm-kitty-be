spring:
  datasource:
    # Dev always uses remote Supabase — set SPRING_DATASOURCE_URL in env (no localhost fallback).
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 9
    lock-retry-count: 3
    connect-retries: 2
    connect-retries-interval: 2s
    postgresql:
      transactional-lock: false

r2:
  verify-connection: false

inkflow:
  openapi:
    enabled: true

logging:
  level:
    com.inkflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO
