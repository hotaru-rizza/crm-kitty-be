components:
  schemas:
    SetShowcaseRequest:
      type: object
      properties:
        tattooIds:
          type: array
          items:
            type: integer
            format: int64
    ApiResponseListTattooDto:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/TattooDto"
        pagination:
          $ref: "#/components/schemas/PaginationDto"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    ErrorDto:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDto"
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    PaginationDto:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    TattooDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        staffId:
          type: string
          format: uuid
        status:
          type: string
        imageUrl:
          type: string
        thumbnailUrl:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        blurHash:
          type: string
        dominantColor:
          type: string
        authorName:
          type: string
        authorUrl:
          type: string
        description:
          type: string
        altDescription:
          type: string
        tags:
          type: array
          items:
            type: string
        showcase:
          type: boolean
    ServiceAssignment:
      type: object
      properties:
        serviceId:
          type: string
          format: uuid
        customPrice:
          type: number
        customDuration:
          type: integer
          format: int32
      required:
      - serviceId
    UpdateStaffServicesRequest:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAssignment"
      required:
      - services
    ApiResponseListStaffServiceDto:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffServiceDto"
        pagination:
          $ref: "#/components/schemas/PaginationDto"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    StaffServiceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        pricingType:
          type: string
        basePrice:
          type: number
        customPrice:
          type: number
        baseDuration:
          type: integer
          format: int32
        customDuration:
          type: integer
          format: int32
        color:
          type: string
        isActive:
          type: boolean
    AddStaffServiceRequest:
      type: object
      properties:
        customPrice:
          type: number
        customDuration:
          type: integer
          format: int32
    ApiResponseStaffServiceDto:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/StaffServiceDto"
        pagination:
          $ref: "#/components/schemas/PaginationDto"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    ScheduleEntry:
      type: object
      properties:
        dayOfWeek:
          type: string
          pattern: ^(monday|tuesday|wednesday|thursday|friday|saturday|sunday)$
        isWorking:
          type: boolean
        startTime:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
      required:
      - dayOfWeek
      - isWorking
    UpdateScheduleRequest:
      type: object
      properties:
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"
      required:
      - schedule
    ApiResponseVoid:
